<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaMasti</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        header {
            background: #111;
            color: white;
            padding: 50px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 48px;
        }

        header p {
            font-size: 20px;
            margin-top: 10px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #1877f2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #111;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>MediaMasti</h1>
        <p>Welcome to our official website</p>
    </header>

    <main>
        <div class="card">
            <h2>Welcome!</h2>
            <p>
                This is the official MediaMasti website.
                We are currently building something amazing.
            </p>

            <a href="#" class="button">Learn More</a>
        </div>
    </main>

    <footer>
        © 2026 MediaMasti. All rights reserved.
    </footer>

</body>
</html>
